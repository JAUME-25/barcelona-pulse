# Barcelona Pulse detrás de nginx: la web estática y /api hacia la API en Docker.
# Se incluye dentro del bloque `server` (HTTPS) del sitio, después de `root` e `index`:
#   root /home/forge/pulse.jaumeperez.com/apps/web/dist;
#   index index.html;
#   include /home/forge/pulse.jaumeperez.com/infra/nginx/pulse.conf;
# Si cambia, `sudo nginx -t` y recargar nginx (en Forge, el despliegue no lo recarga solo).

# Cabeceras de seguridad. Ninguna `location` de abajo usa add_header: si lo hiciera, dejaría de
# heredar estas. El mapa base (estilo, teselas, letras y sprites) llega de OpenFreeMap.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation=(self): «Cerca de mí» pide la ubicación al pulsar el botón; nunca sale del navegador.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# La web pesa ~1,8 MB de JavaScript sin comprimir (la API ya comprime sus respuestas).
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# La API, solo en el propio servidor. X-Forwarded-For lleva la IP que ve nginx (no se añade a una
# cabecera que mande el cliente): la API la usa para el límite de peticiones por IP.
location /api/ {
    proxy_pass http://127.0.0.1:5080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Para el monitor externo: comprueba también la base de datos.
location = /health/ready {
    proxy_pass http://127.0.0.1:5080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# Archivos con huella en el nombre: no cambian nunca.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# La aplicación: cualquier otra ruta sirve index.html, que se revalida siempre.
location / {
    expires -1;
    try_files $uri /index.html;
}
