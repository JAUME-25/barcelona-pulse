name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 10 + PostGIS)
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Las pruebas de integración crean y borran bases temporales en este servidor.
      BP_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=pulse;Password=solo-para-ci
      # En CI una prueba de integración sin base de datos falla en vez de omitirse.
      BP_REQUIRE_DB: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore BarcelonaPulse.slnx
      - name: Formato y estilo
        run: dotnet format BarcelonaPulse.slnx --verify-no-changes --no-restore
      - name: Compilar (también regenera el documento OpenAPI)
        run: dotnet build BarcelonaPulse.slnx --no-restore -c Release
      - name: El contrato OpenAPI versionado está al día
        run: git diff --exit-code -- apps/api/openapi/
      - name: El modelo no tiene cambios sin migración
        run: dotnet ef migrations has-pending-model-changes --project apps/api/BarcelonaPulse.Api.csproj --no-build --configuration Release
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=postgres;Username=pulse;Password=solo-para-ci
      - name: Pruebas unitarias y de integración
        run: dotnet test --solution BarcelonaPulse.slnx --no-build -c Release

  web:
    name: Web (React + TypeScript)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Tipos del cliente al día con el contrato OpenAPI
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Humo en navegador (web, API y PostGIS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Como en local (README): PostGIS, migraciones y API con Docker Compose y el .env de ejemplo.
      - name: PostGIS, migraciones y API
        run: |
          cp .env.example .env
          docker compose up -d --build api
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:5080/health/ready > /dev/null && exit 0
            sleep 2
          done
          echo "La API no responde en /health/ready." >&2
          exit 1
      - name: El demo y las áreas de estudio
        run: |
          docker compose run --rm api ingest demo
          docker compose run --rm api ingest study-areas
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Chromium para Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Compila la web, la sirve con vite preview (que reenvía /api a la API) y la usa en
      # escritorio y móvil, con el mapa base bloqueado.
      - name: Pruebas de humo
        run: npm run test:e2e
        working-directory: apps/web
      - name: Registro de la API
        if: failure()
        run: docker compose logs migrate api
      - name: Trazas de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-playwright
          path: apps/web/test-results/
          retention-days: 7
